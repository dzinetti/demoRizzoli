<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartCampus - Login</title>

    <link
      rel="icon"
      type="image/png"
      href="../resources/logo_smartcampus.png"
    />
    <link rel="stylesheet" href="style.css" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      /* Sovrascrivo il margine della sidebar solo per questa pagina, perchè non è necessaria per il login*/
      .main {
        margin-left: 0;
      }
    </style>
  </head>
  <body>
    <div class="main d-flex align-items-center justify-content-center vh-100">
      <div
        class="card p-4 shadow-lg border-0"
        style="
          width: 100%;
          max-width: 400px;
          background: rgba(0, 0, 0, 0.4);
          backdrop-filter: blur(10px);
          border: 1px solid rgba(255, 255, 255, 0.1) !important;
        "
      >
        <div class="card-body">
          <div class="text-center mb-4">
            <h2 class="fw-bold text-white">SmartCampus</h2>
            <p class="text-white-50">Accedi alla piattaforma</p>
          </div>

          <form action="../app_php/actions/login.php" method="POST">
            <div class="mb-3">
              <label for="email" class="form-label text-white-50"
                >Email Studente / Docente</label
              >
              <input
                type="email"
                class="form-control bg-dark text-white border-secondary"
                id="email"
                name="email"
                required
              />
            </div>

            <div class="mb-4">
              <label for="password" class="form-label text-white-50"
                >Password</label
              >
              <input
                type="password"
                class="form-control bg-dark text-white border-secondary"
                id="password"
                name="password"
                required
              />
            </div>

            <button
              type="submit"
              class="btn btn-primary w-100 fw-bold py-2 shadow"
            >
              Entra
            </button>

            <div class="text-center mt-4">
              <a
                href="registrazione.html"
                class="text-decoration-none text-info small"
                >Non hai un account? Registrati</a
              >
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
