<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrazione</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <style>
      /* Sovrascrivo il margine della sidebar solo per questa pagina, perchè non è necessaria per il login*/
      .main {
        margin-left: 0;
      }
    </style>
  </head>
  <body>
    <div class="main d-flex align-items-center justify-content-center vh-100">
      <div
        class="card p-4 shadow-lg border-0"
        style="
          width: 100%;
          max-width: 400px;
          background: rgba(0, 0, 0, 0.4);
          backdrop-filter: blur(10px);
          border: 1px solid rgba(255, 255, 255, 0.1) !important;
        "
      >
        <div class="card-body">
          <div class="text-center mb-4">
            <h2 class="fw-bold text-white">SmartCampus</h2>
            <p class="text-white-50">Registrati alla piattaforma</p>
          </div>
          <form action="../app_php/actions/registrazione.php" method="POST">
            <div class="mb-2">
              <label for="nome" class="form-label text-white-50">Nome</label>
              <input
                type="text"
                class="form-control bg-dark text-white border-secondary"
                id="nome"
                name="nome"
              />
            </div>

            <div class="mb-2">
              <label for="cognome" class="form-label text-white-50"
                >Cognome</label
              >
              <input
                type="text"
                class="form-control bg-dark text-white border-secondary"
                id="cognome"
                name="cognome"
              />
            </div>

            <div class="mb-2">
              <label for="ruolo" class="form-label text-white-50">Ruolo</label>
              <select
                name="ruolo"
                id="ruolo"
                class="form-select bg-dark text-white border-secondary"
                required
              >
                <option value="" disabled selected>
                  --Seleziona un ruolo--
                </option>
                <option value="studente">Studente</option>
                <option value="admin">Admin</option>
              </select>
            </div>

            <div class="mb-2">
              <label for="email" class="form-label text-white-50">Email</label>
              <input
                type="email"
                class="form-control bg-dark text-white border-secondary"
                id="email"
                name="email"
              />
            </div>

            <div class="mb-2">
              <label for="password" class="form-label text-white-50"
                >Password</label
              >
              <input
                type="password"
                class="form-control bg-dark text-white border-secondary"
                id="password"
                name="password"
              />
            </div>

            <div class="mb-5">
              <label for="password_seconda" class="form-label text-white-50"
                >Password di conferma</label
              >
              <input
                type="password"
                class="form-control bg-dark text-white border-secondary"
                id="password_seconda"
                name="password_seconda"
              />
            </div>

            <button
              type="submit"
              class="btn btn-primary w-100 fw-bold py-2 shadow"
            >
              Registrati
            </button>

            <div class="text-center mt-4">
              <a href="login.html" class="text-decoration-none text-info small"
                >Hai già un account? Accedi</a
              >
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
